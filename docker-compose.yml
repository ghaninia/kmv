services:
  mysql:
    image: mysql:8.0
    container_name: kmv-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kmvpri_main
      MYSQL_USER: kmv
      MYSQL_PASSWORD: kmv
    ports:
      - '3306:3306'
    volumes:
      - kmv-mysql-data:/var/lib/mysql
      - ./database/dumps/kmvpri_main.sql:/docker-entrypoint-initdb.d/import.sql:ro
    networks:
      - kmv-network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kmv-laravel-app
    container_name: kmv-laravel-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: kmvpri_main
      DB_USERNAME: kmv
      DB_PASSWORD: kmv
      APP_URL: http://localhost:8000
    networks:
      - kmv-network
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - 9000

  nginx:
    image: nginx:alpine
    container_name: kmv-nginx
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - '8000:80'
    networks:
      - kmv-network
    depends_on:
      - app

  react:
    build:
      context: .
      dockerfile: Dockerfile.react
    image: kmv-react
    container_name: kmv-react
    working_dir: /var/www/html
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - /var/www/html/node_modules
    ports:
      - '5173:5173'
    networks:
      - kmv-network
    depends_on:
      - app
    environment:
      APP_URL: http://localhost:8000
      VITE_BACKEND_URL: http://localhost:8000
      VITE_HMR_HOST: localhost
      VITE_PORT: 5173
      CHOKIDAR_USEPOLLING: 'true'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:5173']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

networks:
  kmv-network:
    driver: bridge

volumes:
  kmv-mysql-data:

